[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insta-manager"
version = "0.1.0"
description = "CLI tool for managing and publishing to multiple Instagram Business accounts via the official Graph API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "insta-manager contributors" }]
dependencies = [
    "typer>=0.12.0",
    "click>=8.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30.0",
    "respx>=0.21.0",
]

[project.scripts]
insta-manager = "insta_manager.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["insta_manager*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
